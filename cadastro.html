<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Freela Home</title>
    <link rel="stylesheet" href="cadastro.style.css">
</head>
<body>

    <header class="header-principal">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Logo Freela Home" class="logo-img">
            <h1>Freela Home</h1>
        </div>
        <nav class="menu-nav">
            <ul>
                <li><a href="index.html">Voltar ao Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container">

        <section id="cadastro-unico">
            <h2>Cadastro de Usuário</h2>
            <form method="get">
                <p>
                    <label for="nome">Nome Completo:</label><br>
                    <input type="text" id="nome" name="nome" required>
                </p>

                <p>
                    <label for="email">E-mail Corporativo:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="cpf">CPF:</label><br>
                    <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}">
                </p>

                <p>
                    <label for="senha">Senha:</label><br>
                    <input type="password" id="senha" name="senha" required minlength="8">
                </p>

                <p>
                    <label for="nivel-acesso">Nível de Acesso:</label><br>
                    <select id="nivel-acesso" name="nivel_acesso" required>
                        <option value="">Selecione...</option>
                        <option value="cliente">Cliente</option>
                        <option value="trabalhador">Trabalhador</option>
                    </select>
                </p>

                <p class="termos-p">
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">Aceito os Termos de Uso</label>
                </p>

                <p class="botoes-p">
                    <button type="reset" class="btn-cancelar">Cancelar</button>
                    <button type="submit" formaction="dashboard.html" class="btn-cadastrar">Cadastrar</button>
                </p>
            </form>
        </section>

    </main>

    <footer class="footer-principal">
        <hr>
        <h3>Localização da Sede (Freela Home)</h3>
        <div class="mapa-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3705.4747442749416!2d-43.35249592472288!3d-21.761899180076214!2m3!1f0!f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x989b6057a6e19d%3A0xd68cf3bd55ca53e4!2sJuiz%20de%20Fora%2C%20MG!5e0!3m2!1spt-BR!2sbr!4v1700000000000!5m2!1spt-BR!2sbr" 
                width="200" 
                height="200" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade"
                title="Mapa fictício da sede da empresa">
            </iframe>
        </div>
        <p>&copy; 2026 Freela Home - Todos os direitos reservados.</p>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
