<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

 <header>
        <img src="assets/images/logo.png" alt="Logo Freela Home">
        <h1>Smart Control - Portal de Cadastro</h1>
        <nav>
            <ul>
                <li><a href="login.html">Voltar ao Login</a></li>
                <li><a href="dashboard.html">Ir para o Dashboard</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="opcao-cadastro">
            <h2>Opção de Cadastro</h2>
            <form>
                <fieldset>
                    <legend>Selecione o tipo de conta</legend>
                    
                    <input type="radio" id="prestador" name="tipo_usuario" value="prestador">
                    <label for="prestador">Prestador de serviços</label>
                    
                    <input type="radio" id="cliente" name="tipo_usuario" value="cliente">
                    <label for="cliente">Cliente</label>
                </fieldset>
            </form>
        </section>  
        <hr>

        <section id="cadastro-trabalhador">
            <h2>Cadastro de Trabalhador</h2>
            <form action="#" method="post">
                <p>
                    <label for="trabalhador-nome">Nome completo:</label><br>
                    <input type="text" id="trabalhador-nome" name="nome" required>
                </p>
                <p>
                    <label for="trabalhador-cpf">CPF:</label><br>
                    <input type="text" id="trabalhador-cpf" name="cpf" required pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}">
                </p>
                <p>
                    <label for="trabalhador-mei">MEI:</label><br>
                    <input type="text" id="trabalhador-mei" name="mei">
                </p>
                <p>
                    <label for="trabalhador-servico">Serviço prestado:</label><br>
                    <input type="text" id="trabalhador-servico" name="servico_prestado" required>
                </p>
                <p>
                    <label for="trabalhador-credenciais">Credenciais:</label><br>
                    <textarea id="trabalhador-credenciais" name="credenciais" rows="4" cols="50"></textarea>
                </p>
                <p>
                    <input type="checkbox" id="sem-credenciais" name="sem_credenciais" value="sim">
                    <label for="sem-credenciais">não tenho credenciais</label>
                </p>
                
                <fieldset>
                    <legend>Experiência</legend>
                    <input type="radio" id="exp-sim" name="experiencia" value="sim">
                    <label for="exp-sim">sim</label>
                    <input type="radio" id="exp-nao" name="experiencia" value="nao">
                    <label for="exp-nao">não</label>
                </fieldset>

                <p>
                    <label for="trabalhador-tempo">Quanto tempo?</label><br>
                    <input type="text" id="trabalhador-tempo" name="tempo_experiencia">
                </p>

                <!-- Requisitos específicos da avaliação -->
                <p>
                    <label for="trabalhador-email">E-mail Corporativo:</label><br>
                    <input type="email" id="trabalhador-email" name="email" required>
                </p>
                <p>
                    <label for="trabalhador-senha">Senha:</label><br>
                    <input type="password" id="trabalhador-senha" name="senha" required minlength="8">
                </p>
                <p>
                    <label for="trabalhador-nivel">Nível de Acesso:</label><br>
                    <select id="trabalhador-nivel" name="nivel_acesso" required>
                        <option value="">Selecione...</option>
                        <option value="prestador">Prestador</option>
                        <option value="admin">Administrador</option>
                    </select>
                </p>
                <p>
                    <input type="checkbox" id="trabalhador-termos" name="termos" required>
                    <label for="trabalhador-termos">Aceito os Termos de Uso</label>
                </p>

                <p>
                    <button type="reset">Cancelar</button>
                    <button type="submit">Cadastrar</button>
                </p>
            </form>
        </section>

        <hr>

   <section id="cadastro-cliente">
            <h2>Cadastro de Cliente</h2>
            <form action="#" method="post">
                <p>
                    <label for="cliente-nome">Nome completo:</label><br>
                    <input type="text" id="cliente-nome" name="nome" required>
                </p>
                <p>
                    <label for="cliente-cpf">CPF:</label><br>
                    <input type="text" id="cliente-cpf" name="cpf" required pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}">
                </p>
                <p>
                    <label for="cliente-cep">CEP:</label><br>
                    <input type="text" id="cliente-cep" name="cep" required>
                </p>
                <p>
                    <label for="cliente-bairro">Bairro:</label><br>
                    <input type="text" id="cliente-bairro" name="bairro" required>
                </p>
                <p>
                    <label for="cliente-rua">Rua:</label><br>
                    <input type="text" id="cliente-rua" name="rua" required>
                </p>
                <p>
                    <label for="cliente-numero">Número:</label><br>
                    <input type="text" id="cliente-numero" name="numero" required>
                </p>
                <p>
                    <label for="cliente-complemento">Complemento:</label><br>
                    <input type="text" id="cliente-complemento" name="complemento">
                </p>
                <p>
                    <label for="cliente-email">E-mail Corporativo:</label><br>
                    <input type="email" id="cliente-email" name="email" required>
                </p>
                <p>
                    <label for="cliente-senha">Senha:</label><br>
                    <input type="password" id="cliente-senha" name="senha" required minlength="8">
                </p>
                <p>
                    <label for="cliente-nivel">Nível de Acesso:</label><br>
                    <select id="cliente-nivel" name="nivel_acesso" required>
                        <option value="">Selecione...</option>
                        <option value="cliente">Cliente</option>
                    </select>
                </p>
                <p>
                    <input type="checkbox" id="cliente-termos" name="termos" required>
                    <label for="cliente-termos">Aceito os Termos de Uso</label>
                </p>

                <p>
                    <button type="reset">Cancelar</button>
                    <button type="submit">Cadastrar</button>
                </p>
            </form>
        </section>

    </main>
    <footer>
        <hr>
        <h3>Localização da Sede (Freela Home)</h3>

            width="600"

    </footer>

</body>
</html>
