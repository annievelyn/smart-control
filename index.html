<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Freela Home</title>
</head>
<body>

    <header>
        <img src="assets/images/logo.png" alt="Logo Freela Home">
        <h1>Freela Home - Login</h1>
    </header>

    <main>
        <h2>Login</h2>

        <form method="get">
            <p>
                <label for="nome">Nome Completo</label><br>
                <input type="text" id="nome" name="nome" required>
            </p>

            <p>
                <label for="email-cpf">E-mail/CPF</label><br>
                <input type="text" id="email-cpf" name="email_cpf" required>
            </p>

            <p>
                <label for="senha">Senha</label><br>
                <input type="password" id="senha" name="senha" required minlength="8">
            </p>

            <p>
                <button type="reset" id="cancelar">Cancelar</button>
                <button type="submit" formaction="dashboard.html" id="entrar">Entrar</button>
            </p>
        </form>

        <p>
            <a href="cadastro.html">Criar Conta</a> | 
            <a href="esqueci.html">Esqueci Minha Senha</a>
        </p>
    </main>

</body>
</html>
