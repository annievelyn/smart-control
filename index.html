<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-card">
    <h1 class="title">Login</h1>
    
    <div class="avatar-container">
      <div class="avatar-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </div>

    <form action="dashboard.html" method="GET">
      <div class="input-group">
        <input type="text" placeholder="Nome Completo" required>
      </div>

      <div class="input-group">
        <input type="email" placeholder="E-mail" required>
      </div>

      <div class="input-group">
        <input type="password" placeholder="Senha" required>
      </div>

      <div class="button-group">
        <button type="reset" class="btn btn-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-entrar">Entrar</button>
      </div>
    </form>

    <div class="extra-links">
      <a href="cadastro.html" class="link">Criar conta</a>
      <a href="esqueci.html" class="link">Esqueci minha senha</a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
