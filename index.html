<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Freela Home</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <header class="top-header">
        <img src="assets/images/logo.png" alt="Logo Freela Home" class="logo">
    </header>

    <div class="login-container">
        <h1 class="main-title">Freela Home - Login</h1>

        <main class="login-card">
            <h2>Login</h2>

            <form method="get" action="dashboard.html">
                <p>
                    <label for="nome" class="sr-only">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Nome Completo" required>
                </p>

                <p>
                    <label for="email-cpf" class="sr-only">E-mail Corporativo</label>
                    <input type="email" id="email-cpf" name="email_corporativo" placeholder="E-mail Corporativo" required>
                </p>

                <p>
                    <label for="senha" class="sr-only">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Senha" required minlength="8">
                </p>

                <div class="button-group">
                    <button type="reset" id="cancelar">Cancelar</button>
                    <button type="submit" id="entrar">Entrar</button>
                </div>
            </form>

            <p class="links-group">
                <a href="cadastro.html">Criar Conta</a>
                <a href="esqueci.html">Esqueci Minha Senha</a>
            </p>
        </main>
    </div>

</body>
</html>
