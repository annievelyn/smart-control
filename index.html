<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Freela Home</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <header class="top-header">
        <img src="assets/images/logo.png" alt="Logo Freela Home" class="logo">
    </header>

    <div class="login-container">
        <main class="login-card">
            <h2>Login</h2>

            <!-- Ícone de usuário da segunda foto -->
            <div class="user-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>

            <form method="get" action="dashboard.html">
                <p>
                    <label for="nome" class="sr-only">Nome Completo</label>
                    <input type="text" id="nome" name="nome" value="Nome Completo" required>
                </p>

                <p>
                    <label for="email-cpf" class="sr-only">E-mail Corporativo</label>
                    <input type="email" id="email-cpf" name="email_corporativo" value="E-mail" required>
                </p>

                <p>
                    <label for="senha" class="sr-only">Senha</label>
                    <input type="password" id="senha" name="senha" value="Senha" required minlength="8">
                </p>

                <div class="button-group">
                    <button type="reset" id="cancelar">Cancelar</button>
                    <button type="submit" id="entrar">Entrar</button>
                </div>
            </form>

            <p class="links-group">
                <a href="cadastro.html">Criar conta</a>
                <a href="esqueci.html">Esqueci minha senha</a>
            </p>
        </main>
    </div>

</body>
</html>
