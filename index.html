<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Freela Home</title>


</head>
<body>

  <div class="login-card">
    <h2>Login</h2>
    
    <!-- Ícone de Usuário -->
    <div class="user-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>

    <!-- Inputs -->
    <div class="input-group">
      <input type="text" placeholder="Nome Completo">
    </div>
    <div class="input-group">
      <input type="text" placeholder="E-mail/CPF">
    </div>
    <div class="input-group">
      <input type="password" placeholder="Senha">
    </div>

    <!-- Botões -->
    <div class="button-group">
      <button class="btn btn-cancelar" type="button">Cancelar</button>
      <a href="dashboard.html" class="btn btn-entrar">Entrar</a>
    </div>

    <!-- Links -->
    <div class="links-container">
      <a href="cadastro.html">Criar conta</a>
      <a href="esqueci.html">Esqueci minha senha</a>
    </div>
  </div>

</body>
</html>
